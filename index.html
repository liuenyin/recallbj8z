
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>八中重开模拟器</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <style>
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif;
            background-color: #f8fafc;
        }
        .custom-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
        @keyframes criticalFlicker {
            0%, 68%, 100% { opacity: .72; }
            70% { opacity: .9; }
            72% { opacity: .55; }
            74% { opacity: .86; }
            76% { opacity: .68; }
        }
        @keyframes warmGlow {
            0%, 100% { opacity: .35; }
            50% { opacity: .58; }
        }
        .animate-fadeIn { animation: fadeIn 0.3s ease-out; }
        .animate-slideInRight { animation: slideInRight 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .screen-danger-vignette {
            background: radial-gradient(ellipse at center, transparent 38%, rgba(127, 29, 29, .22) 100%), rgba(15, 23, 42, .08);
            box-shadow: inset 0 0 100px 22px rgba(153, 27, 27, .3);
        }
        .screen-danger-flicker {
            background: radial-gradient(ellipse at center, transparent 30%, rgba(127, 29, 29, .3) 100%), rgba(15, 23, 42, .16);
            box-shadow: inset 0 0 120px 28px rgba(153, 27, 27, .42);
            animation: criticalFlicker 3.2s ease-in-out infinite;
        }
        .screen-warm-glow {
            background: rgba(251, 146, 60, .08);
            mix-blend-mode: multiply;
            animation: warmGlow 4s ease-in-out infinite;
        }
        @media (prefers-reduced-motion: reduce) {
            .screen-danger-flicker, .screen-warm-glow { animation: none; }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <!-- 👇👇👇 必须加上这一行！没有它游戏就无法启动！ 👇👇👇 -->
    <script type="module" src="/index.tsx"></script>
    
</body>
</html>
